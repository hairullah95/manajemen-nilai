<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Raport Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfd; margin: 0; padding: 0; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(229, 231, 235, 0.6); }
        .sidebar-active { background: #2563eb; color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #e5e7eb; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, query, addDoc, deleteDoc, updateDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlXDVBSJryVlGwtZWYL_BNnh6-7R-SbXk",
            authDomain: "jurnal-guru-f06df.firebaseapp.com",
            projectId: "jurnal-guru-f06df",
            storageBucket: "jurnal-guru-f06df.firebasestorage.app",
            messagingSenderId: "782875410114",
            appId: "1:782875410114:web:702b8b802901b71d16055b",
            measurementId: "G-9LCGMFSPMM"
        };

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                await signInAnonymously(auth);

                window.fb = { 
                    auth, 
                    db, 
                    methods: { 
                        onAuthStateChanged, 
                        collection, 
                        query, 
                        onSnapshot, 
                        doc, 
                        setDoc, 
                        addDoc, 
                        deleteDoc, 
                        updateDoc, 
                        where, 
                        getDocs, 
                        signInAnonymously 
                    } 
                };

                window.dispatchEvent(new Event('firebase-ready'));
            } catch (error) {
                console.error("Gagal inisialisasi Firebase:", error);
                window.dispatchEvent(new CustomEvent('firebase-error', { detail: error.message }));
            }
        }

        initFirebase();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Opsi Kehadiran
        const ATTENDANCE_OPTIONS = [
            { label: 'Hadir Penuh Perhatian', score: 100, symbol: '🌟', badgeBg: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
            { label: 'Hadir 1/2 Perhatian', score: 95, symbol: '⛅', badgeBg: 'bg-teal-100 text-teal-800 border-teal-300' },
            { label: 'Hadir Tidur', score: 90, symbol: '💤', badgeBg: 'bg-blue-100 text-blue-800 border-blue-300' },
            { label: 'Terlambat', score: 85, symbol: '⏰', badgeBg: 'bg-yellow-100 text-yellow-800 border-yellow-300' },
            { label: 'Izin', score: 80, symbol: '✉️', badgeBg: 'bg-indigo-100 text-indigo-800 border-indigo-300' },
            { label: 'Sakit', score: 75, symbol: '🤒', badgeBg: 'bg-purple-100 text-purple-800 border-purple-300' },
            { label: 'Bolos', score: 70, symbol: '🚪', badgeBg: 'bg-orange-100 text-orange-800 border-orange-300' },
            { label: 'Alfa', score: 65, symbol: '❌', badgeBg: 'bg-red-100 text-red-800 border-red-300' }
        ];

        // Helper perhitungan nilai siswa
        const calculateStudentStats = (students, scores, classes) => {
            return students.map(student => {
                const studentScores = scores.filter(s => s.studentId === student.id);
                const className = classes.find(c => c.id === student.classId)?.name || 'Tanpa Kelas';

                // Kelompokkan nilai per pertemuan
                const meetingMap = {};
                studentScores.forEach(sc => {
                    if (sc.type === 'kehadiran' || sc.type === 'ph') {
                        if (!sc.meeting) return;
                        if (!meetingMap[sc.meeting]) meetingMap[sc.meeting] = {};
                        if (sc.type === 'kehadiran') meetingMap[sc.meeting].kehadiran = parseFloat(sc.score) || 0;
                        if (sc.type === 'ph') meetingMap[sc.meeting].ph = parseFloat(sc.score) || 0;
                    }
                });

                // Hitung total nilai per pertemuan (Kehadiran 50% + PH 50%)
                const meetingFinalScores = Object.keys(meetingMap).map(mKey => {
                    const m = meetingMap[mKey];
                    const keh = m.kehadiran !== undefined ? m.kehadiran : null;
                    const ph = m.ph !== undefined ? m.ph : null;

                    if (keh !== null && ph !== null) return (keh * 0.5) + (ph * 0.5);
                    if (keh !== null) return keh;
                    if (ph !== null) return ph;
                    return 0;
                });

                const meetingAvg = meetingFinalScores.length > 0 
                    ? meetingFinalScores.reduce((a, b) => a + b, 0) / meetingFinalScores.length 
                    : null;

                // Ambil nilai hafalan
                const hafalanEntries = studentScores.filter(sc => sc.type === 'hafalan');
                let hafalanScores = [];
                hafalanEntries.forEach(he => {
                    if (Array.isArray(he.hafalanScores)) {
                        hafalanScores = [...hafalanScores, ...he.hafalanScores.filter(v => v !== "" && v !== null && !isNaN(v)).map(Number)];
                    }
                });

                const hafalanAvg = hafalanScores.length > 0 
                    ? hafalanScores.reduce((a, b) => a + b, 0) / hafalanScores.length 
                    : null;

                // Hitung Rata-rata Akhir (Keseluruhan)
                let finalComponents = [];
                if (meetingAvg !== null) finalComponents.push(meetingAvg);
                if (hafalanAvg !== null) finalComponents.push(hafalanAvg);

                const overallAvg = finalComponents.length > 0 
                    ? finalComponents.reduce((a, b) => a + b, 0) / finalComponents.length 
                    : 0;

                return {
                    id: student.id,
                    name: student.name,
                    classId: student.classId,
                    className: className,
                    meetingAvg: meetingAvg !== null ? meetingAvg.toFixed(1) : '-',
                    hafalanAvg: hafalanAvg !== null ? hafalanAvg.toFixed(1) : '-',
                    overallAvg: parseFloat(overallAvg.toFixed(1)),
                    hasScores: finalComponents.length > 0
                };
            });
        };

        const App = () => {
            const [accessCode, setAccessCode] = useState(localStorage.getItem('eraport_access_code') || '');
            const [tempCode, setTempCode] = useState('');
            const [user, setUser] = useState(null);
            const [fbReady, setFbReady] = useState(!!window.fb);
            const [error, setError] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [classes, setClasses] = useState([]);
            const [students, setStudents] = useState([]);
            const [scores, setScores] = useState([]);
            const [loading, setLoading] = useState(false);
            
            // State Sembunyikan/Tampilkan Menu Sidebar (Responsive)
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [isMobileOpen, setIsMobileOpen] = useState(false);

            const appId = "eraport-pro-v1";

            const sortedClasses = useMemo(() => {
                return [...classes].sort((a, b) => a.name.localeCompare(b.name, 'id', { numeric: true }));
            }, [classes]);

            const sortedStudents = useMemo(() => {
                return [...students].sort((a, b) => a.name.localeCompare(b.name, 'id', { sensitivity: 'base' }));
            }, [students]);

            useEffect(() => {
                const handleFbReady = () => setFbReady(true);
                const handleFbError = (e) => {
                    setError(e.detail);
                    setLoading(false);
                };

                window.addEventListener('firebase-ready', handleFbReady);
                window.addEventListener('firebase-error', handleFbError);
                if (window.fb) setFbReady(true);

                return () => {
                    window.removeEventListener('firebase-ready', handleFbReady);
                    window.removeEventListener('firebase-error', handleFbError);
                };
            }, []);

            useEffect(() => {
                if (!fbReady || !accessCode) return;
                setUser({ uid: accessCode.trim().toLowerCase() });
                setLoading(false);
            }, [fbReady, accessCode]);

            useEffect(() => {
                if (!user || !fbReady) return;

                const unsubClasses = window.fb.methods.onSnapshot(
                    window.fb.methods.collection(window.fb.db, 'artifacts', appId, 'users', user.uid, 'classes'),
                    (snap) => setClasses(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                    (err) => console.error("Firestore Error:", err)
                );
                const unsubStudents = window.fb.methods.onSnapshot(
                    window.fb.methods.collection(window.fb.db, 'artifacts', appId, 'users', user.uid, 'students'),
                    (snap) => setStudents(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                    (err) => console.error("Firestore Error:", err)
                );
                const unsubScores = window.fb.methods.onSnapshot(
                    window.fb.methods.collection(window.fb.db, 'artifacts', appId, 'users', user.uid, 'scores'),
                    (snap) => setScores(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                    (err) => console.error("Firestore Error:", err)
                );

                return () => { unsubClasses(); unsubStudents(); unsubScores(); };
            }, [user, fbReady]);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const handleLogin = (e) => {
                e.preventDefault();
                if (!tempCode.trim()) return alert('Masukkan Kode Akses terlebih dahulu!');
                const cleanCode = tempCode.trim().toLowerCase();
                localStorage.setItem('eraport_access_code', cleanCode);
                setAccessCode(cleanCode);
            };

            const handleLogout = () => {
                if (confirm('Keluar dari sesi ini?')) {
                    localStorage.removeItem('eraport_access_code');
                    setAccessCode('');
                    setUser(null);
                }
            };

            if (error) return (
                <div className="h-screen flex flex-col items-center justify-center p-6 text-center bg-white">
                    <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mb-4">
                        <i data-lucide="alert-circle" className="w-10 h-10"></i>
                    </div>
                    <h2 className="text-2xl font-bold text-gray-900 mb-2">Gagal Memuat Firebase</h2>
                    <p className="text-gray-500 max-w-md">{error}</p>
                    <button onClick={() => window.location.reload()} className="mt-6 bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg hover:bg-blue-700">Refresh Halaman</button>
                </div>
            );

            if (!accessCode) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 flex items-center justify-center p-4">
                        <div className="glass-card w-full max-w-md p-8 md:p-10 rounded-[2.5rem] shadow-xl space-y-6 bg-white">
                            <div className="text-center space-y-2">
                                <div className="w-16 h-16 bg-blue-600 text-white rounded-3xl mx-auto flex items-center justify-center shadow-lg shadow-blue-200">
                                    <i data-lucide="book-open" className="w-8 h-8"></i>
                                </div>
                                <h1 className="text-2xl font-black text-gray-900 tracking-tight">E-Raport Pro</h1>
                                <p className="text-gray-400 text-sm font-medium">Masukkan Kode Akses / ID Guru untuk menyinkronkan data.</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Kode Akses Unik</label>
                                    <input 
                                        type="text" 
                                        value={tempCode} 
                                        onChange={e => setTempCode(e.target.value)} 
                                        placeholder="Contoh: guruandalan2026" 
                                        className="w-full bg-gray-50 border-2 border-gray-100 p-4 rounded-2xl outline-none focus:border-blue-600 font-bold text-sm text-center tracking-wider" 
                                        required 
                                    />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all text-sm">
                                    MASUK & SINKRONKAN
                                </button>
                            </form>
                            <p className="text-xs text-center text-gray-400">💡 Tips: Gunakan kode yang sama di HP dan laptop agar data langsung terhubung.</p>
                        </div>
                    </div>
                );
            }

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center gap-4 bg-white">
                    <div className="w-14 h-14 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <div className="text-center">
                        <p className="text-gray-900 font-bold text-lg">E-Raport Pro</p>
                        <p className="text-gray-400 text-sm animate-pulse">Menghubungkan ke Database...</p>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-[#fcfcfd]">
                    {/* Header Mobile */}
                    <div className="md:hidden flex items-center justify-between bg-white border-b border-gray-100 p-4 sticky top-0 z-30 shadow-sm">
                        <div className="flex items-center gap-3 text-blue-600">
                            <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-md">
                                <i data-lucide="book-open" className="w-5 h-5"></i>
                            </div>
                            <span className="font-extrabold text-lg tracking-tight text-gray-900">E-Raport Pro</span>
                        </div>
                        <button onClick={() => setIsMobileOpen(!isMobileOpen)} className="p-2.5 bg-gray-50 text-gray-700 rounded-xl hover:bg-gray-100 transition-colors">
                            <i data-lucide={isMobileOpen ? "x" : "menu"} className="w-6 h-6"></i>
                        </button>
                    </div>

                    {/* Overlay Mobile */}
                    {isMobileOpen && (
                        <div onClick={() => setIsMobileOpen(false)} className="fixed inset-0 bg-black/20 z-40 md:hidden backdrop-blur-sm"></div>
                    )}

                    {/* Sidebar Container */}
                    <aside className={`fixed md:static inset-y-0 left-0 z-50 bg-white border-r border-gray-100 flex flex-col p-6 space-y-8 transition-all duration-300 ease-in-out 
                        ${isMobileOpen ? 'translate-x-0 w-72' : '-translate-x-full md:translate-x-0'} 
                        ${isSidebarOpen ? 'md:w-72' : 'md:w-24 md:p-4'}`}
                    >
                        {/* Header Sidebar Desktop & Toggle Button */}
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-3 text-blue-600 overflow-hidden">
                                <div className="w-10 h-10 md:w-12 md:h-12 bg-blue-600 rounded-2xl flex-shrink-0 flex items-center justify-center text-white shadow-lg shadow-blue-200">
                                    <i data-lucide="book-open" className="w-5 h-5 md:w-6 md:h-6"></i>
                                </div>
                                {isSidebarOpen && (
                                    <span className="font-extrabold text-xl md:text-2xl tracking-tight text-gray-900 truncate">E-Raport</span>
                                )}
                            </div>
                            
                            {/* Tombol Sembunyikan Sidebar Desktop */}
                            <button 
                                onClick={() => setIsSidebarOpen(!isSidebarOpen)} 
                                className="hidden md:flex p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-xl transition-all"
                                title={isSidebarOpen ? "Sembunyikan Menu" : "Tampilkan Menu"}
                            >
                                <i data-lucide={isSidebarOpen ? "panel-left-close" : "panel-left-open"} className="w-5 h-5"></i>
                            </button>

                            {/* Tombol Tutup Mobile */}
                            <button onClick={() => setIsMobileOpen(false)} className="md:hidden text-gray-400 hover:text-gray-600 p-2">
                                <i data-lucide="x" className="w-6 h-6"></i>
                            </button>
                        </div>
                        
                        {/* Navigasi Menu */}
                        <nav className="flex-1 space-y-2">
                            {[
                                { id: 'dashboard', label: 'Ringkasan', icon: 'layout' },
                                { id: 'manajemen', label: 'Data Siswa', icon: 'users' },
                                { id: 'input', label: 'Input Nilai', icon: 'edit-3' },
                                { id: 'rekap', label: 'Rekap & Ekspor', icon: 'file-text' }
                            ].map(item => (
                                <button 
                                    key={item.id} 
                                    onClick={() => { setActiveTab(item.id); setIsMobileOpen(false); }} 
                                    className={`w-full flex items-center gap-4 p-3.5 md:p-4 rounded-2xl font-semibold transition-all duration-300 ${activeTab === item.id ? 'sidebar-active' : 'text-gray-400 hover:bg-gray-50 hover:text-gray-600'} ${!isSidebarOpen && 'md:justify-center md:px-0'}`}
                                    title={!isSidebarOpen ? item.label : ''}
                                >
                                    <i data-lucide={item.icon} className="w-5 h-5 flex-shrink-0"></i>
                                    {isSidebarOpen && <span className="truncate">{item.label}</span>}
                                </button>
                            ))}
                        </nav>

                        {/* Footer Sidebar */}
                        <div className="space-y-4">
                            {isSidebarOpen ? (
                                <div className="p-4 bg-gray-50 rounded-2xl space-y-1">
                                    <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Kode Akses Aktif</p>
                                    <p className="text-xs font-black text-blue-600 truncate">{accessCode}</p>
                                </div>
                            ) : (
                                <div className="hidden md:flex justify-center p-2 bg-gray-50 rounded-xl" title={`Kode: ${accessCode}`}>
                                    <i data-lucide="key" className="w-4 h-4 text-blue-600"></i>
                                </div>
                            )}

                            <button 
                                onClick={handleLogout} 
                                className={`w-full flex items-center gap-2 p-3 text-xs font-bold text-red-500 hover:bg-red-50 rounded-xl transition-colors ${!isSidebarOpen && 'md:justify-center'}`}
                                title={!isSidebarOpen ? 'Keluar' : ''}
                            >
                                <i data-lucide="log-out" className="w-4 h-4 flex-shrink-0"></i> 
                                {isSidebarOpen && <span>Ganti Kode / Keluar</span>}
                            </button>
                        </div>
                    </aside>

                    {/* Area Konten Utama */}
                    <main className="flex-1 overflow-y-auto h-screen custom-scroll">
                        {/* Header bar desktop toggle */}
                        <div className="hidden md:flex items-center justify-between p-4 px-8 bg-white border-b border-gray-100">
                            <button 
                                onClick={() => setIsSidebarOpen(!isSidebarOpen)} 
                                className="flex items-center gap-2 text-xs font-bold text-gray-500 bg-gray-50 hover:bg-gray-100 px-3 py-2 rounded-xl transition-colors"
                            >
                                <i data-lucide={isSidebarOpen ? "chevron-left" : "menu"} className="w-4 h-4"></i>
                                <span>{isSidebarOpen ? "Sembunyikan Menu" : "Tampilkan Menu"}</span>
                            </button>
                            <span className="text-xs font-bold text-gray-400">Status: <span className="text-emerald-600">Tersambung (Online)</span></span>
                        </div>

                        <div className="max-w-6xl mx-auto p-4 sm:p-6 md:p-12 pb-24 md:pb-12">
                            {activeTab === 'dashboard' && <Dashboard classes={sortedClasses} students={sortedStudents} scores={scores} />}
                            {activeTab === 'manajemen' && <ManajemenData classes={sortedClasses} students={sortedStudents} user={user} appId={appId} />}
                            {activeTab === 'input' && <InputNilai classes={sortedClasses} students={sortedStudents} user={user} appId={appId} />}
                            {activeTab === 'rekap' && <RekapNilai classes={sortedClasses} students={sortedStudents} scores={scores} />}
                        </div>
                    </main>
                </div>
            );
        };

        // Component 1: Dashboard dengan Analisis Nilai Siswa
        const Dashboard = ({ classes, students, scores }) => {
            const calculatedData = useMemo(() => {
                return calculateStudentStats(students, scores, classes);
            }, [students, scores, classes]);

            const studentsWithScores = useMemo(() => {
                return calculatedData.filter(s => s.hasScores).sort((a, b) => b.overallAvg - a.overallAvg);
            }, [calculatedData]);

            const highestStudents = useMemo(() => {
                if (studentsWithScores.length === 0) return [];
                const maxVal = studentsWithScores[0].overallAvg;
                return studentsWithScores.filter(s => s.overallAvg === maxVal);
            }, [studentsWithScores]);

            const lowestStudents = useMemo(() => {
                if (studentsWithScores.length === 0) return [];
                const minVal = studentsWithScores[studentsWithScores.length - 1].overallAvg;
                return studentsWithScores.filter(s => s.overallAvg === minVal);
            }, [studentsWithScores]);

            const averageClassScore = useMemo(() => {
                if (studentsWithScores.length === 0) return 0;
                const total = studentsWithScores.reduce((acc, curr) => acc + curr.overallAvg, 0);
                return (total / studentsWithScores.length).toFixed(1);
            }, [studentsWithScores]);

            return (
                <div className="space-y-6 md:space-y-10 animate-in fade-in duration-500">
                    <div>
                        <h1 className="text-2xl sm:text-3xl md:text-4xl font-black text-gray-900 tracking-tight">Selamat Datang, Guru!</h1>
                        <p className="text-gray-400 mt-1 md:mt-2 text-sm md:text-base font-medium">Rangkuman data penilaian dan analisis prestasi siswa Anda.</p>
                    </div>

                    {/* Stat Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 md:gap-6">
                        <div className="glass-card p-6 rounded-[2rem] flex flex-col gap-3 shadow-sm border-none">
                            <div className="w-12 h-12 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center"><i data-lucide="grid"></i></div>
                            <div>
                                <h2 className="text-3xl font-black text-gray-900">{classes.length}</h2>
                                <p className="text-gray-400 font-bold text-xs uppercase tracking-widest">Total Kelas</p>
                            </div>
                        </div>
                        <div className="glass-card p-6 rounded-[2rem] flex flex-col gap-3 shadow-sm border-none">
                            <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center"><i data-lucide="users"></i></div>
                            <div>
                                <h2 className="text-3xl font-black text-gray-900">{students.length}</h2>
                                <p className="text-gray-400 font-bold text-xs uppercase tracking-widest">Siswa Terdaftar</p>
                            </div>
                        </div>
                        <div className="glass-card p-6 rounded-[2rem] flex flex-col gap-3 shadow-sm border-none">
                            <div className="w-12 h-12 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center"><i data-lucide="database"></i></div>
                            <div>
                                <h2 className="text-3xl font-black text-gray-900">{scores.length}</h2>
                                <p className="text-gray-400 font-bold text-xs uppercase tracking-widest">Entri Penilaian</p>
                            </div>
                        </div>
                        <div className="glass-card p-6 rounded-[2rem] flex flex-col gap-3 shadow-sm border-none">
                            <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center"><i data-lucide="award"></i></div>

                                                <div>
                                                    <p className="font-bold text-gray-800 text-sm">{s.name}</p>
                                                    <p className="text-[10px] text-rose-600 font-black uppercase">{s.className}</p>

                    {/* Panduan Singkat */}
                    <div className="glass-card p-6 md:p-8 rounded-[2.5rem] border-none shadow-sm">
                        <div className="flex items-center gap-4 mb-4">

                            <li className="flex gap-3"><span className="text-blue-600 font-black">2.</span> <strong>Nilai Hafalan:</strong> Berdiri sendiri terdiri dari 9 kolom hafalan terpisah.</li>
                            <li className="flex gap-3"><span className="text-blue-600 font-black">3.</span> <strong>Skor Kehadiran:</strong> Memiliki simbol dan nilai otomatis (100 s.d 65).</li>
                            <li className="flex gap-3"><span className="text-blue-600 font-black">4.</span> <strong>Analisis Otomatis:</strong> Nilai tertinggi dan terendah diperbarui secara real-time.</li>

        // Component 2: Data Siswa (Dengan Edit Nama Kelas & Nama Siswa)
        const ManajemenData = ({ classes, students, user, appId }) => {
            const [newClass, setNewClass] = useState('');
            const [studentName, setStudentName] = useState('');
            const [selectedClassId, setSelectedClassId] = useState('');
            const [importClassId, setImportClassId] = useState('');
            const [uploading, setUploading] = useState(false);

            // State Edit Kelas
            const [editingClass, setEditingClass] = useState(null); // { id, name }
            // State Edit Siswa
            const [editingStudent, setEditingStudent] = useState(null); // { id, name, classId }

            const addClass = async () => {
                if (!newClass || !user) return;
                try {
                    await window.fb.methods.addDoc(window.fb.methods.collection(window.fb.db, 'artifacts', appId, 'users', user.uid, 'classes'), { name: newClass.trim() });
                    setNewClass('');
                } catch (err) {
                    console.error("Gagal tambah kelas:", err);
                    alert("Error Firebase: " + err.message);
                }
            };

            const updateClass = async () => {
                if (!editingClass || !editingClass.name.trim()) return;
                try {
                    await window.fb.methods.updateDoc(
                        window.fb.methods.doc(window.fb.db, 'artifacts', appId, 'users', user.uid, 'classes', editingClass.id),
                        { name: editingClass.name.trim() }
                    );
                    setEditingClass(null);
                } catch (err) {
                    console.error("Gagal update kelas:", err);
                    alert("Error Firebase: " + err.message);
                }
            };

            const addStudent = async () => {
                if (!studentName || !selectedClassId || !user) return;
                try {
                    await window.fb.methods.addDoc(window.fb.methods.collection(window.fb.db, 'artifacts', appId, 'users', user.uid, 'students'), { 
                        name: studentName.trim(), 
                        classId: selectedClassId 
                    });
                    setStudentName('');
                } catch (err) {
                    console.error("Gagal tambah siswa:", err);
                    alert("Error Firebase: " + err.message);
                }
            };

            const updateStudent = async () => {
                if (!editingStudent || !editingStudent.name.trim() || !editingStudent.classId) return;
                try {
                    await window.fb.methods.updateDoc(
                        window.fb.methods.doc(window.fb.db, 'artifacts', appId, 'users', user.uid, 'students', editingStudent.id),
                        { 
                            name: editingStudent.name.trim(),
                            classId: editingStudent.classId
                        }
                    );
                    setEditingStudent(null);
                } catch (err) {
                    console.error("Gagal update siswa:", err);
                    alert("Error Firebase: " + err.message);
                }
            };

            const deleteItem = async (coll, id) => {
                if (confirm("Apakah Anda yakin ingin menghapus data ini?")) {
                    try {
                        await window.fb.methods.deleteDoc(window.fb.methods.doc(window.fb.db, 'artifacts', appId, 'users', user.uid, coll, id));
                    } catch (err) {
                        console.error("Gagal hapus:", err);
                        alert("Error Firebase: " + err.message);
                    }
                }
            };

            const handleExcelImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!importClassId) {
                    alert('Silakan pilih Kelas target terlebih dahulu sebelum mengimpor file!');
                    e.target.value = '';
                    return;
                }

                setUploading(true);
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws);

                        let count = 0;
                        for (const row of data) {
                            const name = row['Nama'] || row['nama'] || row['Nama Siswa'] || row['nama siswa'] || row['NAMA'] || Object.values(row)[0];
                            if (name && typeof name === 'string' && name.trim() !== '') {
                                await window.fb.methods.addDoc(
                                    window.fb.methods.collection(window.fb.db, 'artifacts', appId, 'users', user.uid, 'students'), 
                                    { name: name.trim(), classId: importClassId }
                                );
                                count++;
                            }
                        }
                        alert(`Berhasil mengimpor ${count} siswa ke dalam kelas!`);
                    } catch (err) {
                        console.error(err);
                        alert("Error Firebase: " + err.message);
                    } finally {
                        setUploading(false);
                        e.target.value = '';
                    }
                };
                reader.readAsBinaryString(file);
            };

            const downloadTemplate = () => {
                const ws = XLSX.utils.json_to_sheet([{ Nama: "Contoh Nama Siswa 1" }, { Nama: "Contoh Nama Siswa 2" }]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Format_Siswa");
                XLSX.writeFile(wb, "Template_Impor_Siswa.xlsx");
            };

            return (
                <div className="space-y-6 md:space-y-10 animate-in slide-in-from-bottom-4 duration-500">
                    <h1 className="text-2xl sm:text-3xl md:text-4xl font-black text-gray-900 tracking-tight">Manajemen Data Siswa & Kelas</h1>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
                        {/* Manajemen Kelas */}
                        <div className="glass-card p-6 md:p-8 rounded-[2rem] md:rounded-[2.5rem] border-none shadow-sm space-y-6">
                            <div className="flex justify-between items-center">
                                <h3 className="text-lg md:text-xl font-bold">Daftar Kelas</h3>
                                <span className="text-xs font-black px-3 py-1 bg-blue-100 text-blue-600 rounded-full">{classes.length}</span>
                            </div>
                            <div className="flex gap-2">
                                <input value={newClass} onChange={e => setNewClass(e.target.value)} className="flex-1 bg-gray-50 border-none p-3.5 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-semibold text-sm" placeholder="Nama Kelas (mis: VII-A)" />
                                <button onClick={addClass} className="bg-blue-600 text-white px-5 rounded-2xl font-bold hover:bg-blue-700 shadow-md shadow-blue-100 text-sm">Tambah</button>
                            </div>
                            
                            <div className="space-y-2 max-h-60 overflow-y-auto custom-scroll pr-2">
                                {classes.map(c => (
                                    <div key={c.id} className="p-3 bg-gray-50/80 rounded-2xl flex justify-between items-center border border-transparent hover:border-blue-200 transition-all">
                                        <span className="font-bold text-gray-700 text-sm">{c.name}</span>
                                        <div className="flex items-center gap-1">
                                            <button 
                                                onClick={() => setEditingClass({ id: c.id, name: c.name })} 
                                                className="p-1.5 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
                                                title="Edit Nama Kelas"
                                            >
                                                <i data-lucide="edit-2" className="w-4 h-4"></i>
                                            </button>
                                            <button 
                                                onClick={() => deleteItem('classes', c.id)} 
                                                className="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
                                                title="Hapus Kelas"
                                            >
                                                <i data-lucide="trash-2" className="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Tambah Siswa Satuan */}
                        <div className="glass-card p-6 md:p-8 rounded-[2rem] md:rounded-[2.5rem] border-none shadow-sm space-y-6">
                            <h3 className="text-lg md:text-xl font-bold">Tambah Siswa Satuan</h3>
                            <div className="space-y-4">

                                        <option value="">-- Pilih Kelas --</option>
                                        {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </div>
                                <button onClick={addStudent} className="w-full bg-emerald-600 text-white p-3.5 rounded-2xl font-bold hover:bg-emerald-700 shadow-md shadow-emerald-100 transition-all text-sm">Simpan Siswa</button>
                            </div>
                        </div>

                        {/* Impor Excel Siswa */}
                        <div className="glass-card p-6 md:p-8 rounded-[2rem] md:rounded-[2.5rem] border-none shadow-sm space-y-6 bg-gradient-to-br from-blue-50/50 to-indigo-50/50">
                            <h3 className="text-lg md:text-xl font-bold text-blue-900">Impor Excel Siswa</h3>
                            <div className="space-y-4">
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black text-blue-400 uppercase tracking-widest">Target Kelas Impor</label>
                                    <select value={importClassId} onChange={e => setImportClassId(e.target.value)} className="w-full bg-white border border-blue-100 p-3.5 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-semibold text-sm">
                                        <option value="">-- Pilih Kelas Target --</option>
                                        {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] font-black text-blue-400 uppercase tracking-widest">Pilih File (.xlsx / .csv)</label>
                                    <input type="file" accept=".xlsx, .xls, .csv" onChange={handleExcelImport} disabled={uploading} className="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer" />
                                </div>
                                <button onClick={downloadTemplate} className="w-full bg-white text-blue-600 border border-blue-200 py-3 rounded-2xl font-bold hover:bg-blue-50 transition-all text-xs flex items-center justify-center gap-2">
                                    <i data-lucide="download" className="w-4 h-4"></i> Unduh Format Template
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Daftar Seluruh Siswa dengan Tombol Edit Nama & Delete */}
                    <div className="glass-card p-6 md:p-10 rounded-[2rem] md:rounded-[3rem] border-none shadow-sm space-y-6">
                        <h3 className="text-xl md:text-2xl font-bold">Daftar Seluruh Siswa Urut A-Z ({students.length})</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[500px] overflow-y-auto custom-scroll p-1">
                            {students.map(s => (
                                <div key={s.id} className="p-4 bg-white border border-gray-100 rounded-[1.5rem] flex justify-between items-center shadow-sm hover:border-blue-200 transition-all">
                                    <div className="overflow-hidden pr-2">
                                        <p className="font-bold text-gray-800 text-sm truncate">{s.name}</p>
                                        <p className="text-[10px] text-blue-600 font-black uppercase tracking-tighter">{classes.find(c => c.id === s.classId)?.name || 'Tanpa Kelas'}</p>

                                    <div className="flex items-center gap-1">
                                        <button 
                                            onClick={() => setEditingStudent({ id: s.id, name: s.name, classId: s.classId })}

                                            title="Edit Nama Siswa / Kelas"

                                            <i data-lucide="edit-3" className="w-4 h-4"></i>
                                        </button>
                                        <button 
                                            onClick={() => deleteItem('students', s.id)} 
                                            className="p-2 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors"
                                            title="Hapus Siswa"
                                        >
                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            ))}
                            {students.length === 0 && (
                                <p className="text-gray-400 text-sm col-span-full text-center py-6">Belum ada data siswa terdaftar.</p>
                            )}
                        </div>
                    </div>

                    {/* Modal Edit Nama Kelas */}
                    {editingClass && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">

                                <h3 className="text-xl font-black text-gray-900">Edit Nama Kelas</h3>
                                <div className="space-y-2">
                                    <label className="text-xs font-black text-gray-400 uppercase">Nama Kelas Baru</label>
                                    <input 
                                        type="text" 
                                        value={editingClass.name} 
                                        onChange={e => setEditingClass({...editingClass, name: e.target.value})}
                                        className="w-full bg-gray-50 border border-gray-200 p-4 rounded-2xl font-bold outline-none focus:border-blue-600"
                                    />
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setEditingClass(null)} className="flex-1 bg-gray-100 text-gray-600 py-3 rounded-2xl font-bold hover:bg-gray-200">Batal</button>
                                    <button onClick={updateClass} className="flex-1 bg-blue-600 text-white py-3 rounded-2xl font-bold hover:bg-blue-700">Simpan</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Edit Nama & Kelas Siswa */}
                    {editingStudent && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full space-y-6 shadow-2xl">
                                <h3 className="text-xl font-black text-gray-900">Edit Data Siswa</h3>
                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-gray-400 uppercase">Nama Siswa</label>
                                        <input 
                                            type="text" 
                                            value={editingStudent.name} 
                                            onChange={e => setEditingStudent({...editingStudent, name: e.target.value})}
                                            className="w-full bg-gray-50 border border-gray-200 p-4 rounded-2xl font-bold outline-none focus:border-blue-600"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-gray-400 uppercase">Pindah Kelas</label>
                                        <select 
                                            value={editingStudent.classId} 
                                            onChange={e => setEditingStudent({...editingStudent, classId: e.target.value})}
                                            className="w-full bg-gray-50 border border-gray-200 p-4 rounded-2xl font-bold outline-none focus:border-blue-600"
                                        >
                                            {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setEditingStudent(null)} className="flex-1 bg-gray-100 text-gray-600 py-3 rounded-2xl font-bold hover:bg-gray-200">Batal</button>
                                    <button onClick={updateStudent} className="flex-1 bg-blue-600 text-white py-3 rounded-2xl font-bold hover:bg-blue-700">Simpan</button>
                                </div>
                            </div>
                        </div>
                    )}

            );

        // Component 3: Input Nilai (Kehadiran, Hafalan, Penilaian Harian)
        const InputNilai = ({ classes, students, user, appId }) => {
            const [selClass, setSelClass] = useState('');
            const [jenisNilai, setJenisNilai] = useState('Kehadiran'); // Kehadiran, Hafalan, Penilaian Harian
            const [meetingName, setMeetingName] = useState('');
            
            // State penampung input per jenis penilaian
            const [attendanceData, setAttendanceData] = useState({}); // { studentId: score }
            const [hafalanData, setHafalanData] = useState({}); // { studentId: [h1, h2, ..., h9] }
            const [phData, setPhData] = useState({}); // { studentId: score }
            const [bulkVal, setBulkVal] = useState('');

            const filteredStudents = useMemo(() => students.filter(s => s.classId === selClass), [students, selClass]);

            // Reset state saat kelas atau jenis nilai berganti
            useEffect(() => {
                setAttendanceData({});
                setHafalanData({});
                setPhData({});
                setBulkVal('');
            }, [selClass, jenisNilai]);

            // Set Massal untuk PH / Kehadiran
            const handleBulkPH = (val) => {
                setBulkVal(val);
                const updated = {};
                filteredStudents.forEach(s => {
                    updated[s.id] = parseFloat(val) || 0;
                });
                setPhData(updated);
            };

            const handleBulkAttendance = (score) => {
                const updated = {};
                filteredStudents.forEach(s => {
                    updated[s.id] = score;
                });
                setAttendanceData(updated);
            };

            // Handling Simpan Kehadiran
            const saveKehadiran = async () => {
                if (!selClass || !meetingName) return alert('Mohon pilih Kelas dan isi Nama Pertemuan!');
                if (Object.keys(attendanceData).length === 0) return alert('Belum ada status kehadiran yang dipilih.');

                try {
                    for (const studentId of Object.keys(attendanceData)) {
                        await window.fb.methods.addDoc(window.fb.methods.collection(window.fb.db, 'artifacts', appId, 'users', user.uid, 'scores'), {
                            studentId, 
                            classId: selClass, 
                            type: 'kehadiran', 
                            meeting: meetingName.trim(),
                            score: attendanceData[studentId],
                            timestamp: new Date().toISOString()
                        });
                    }
                    alert('Data Kehadiran berhasil disimpan!');
                    setAttendanceData({});
                } catch (e) {
                    console.error("Gagal simpan kehadiran:", e);
                    alert("Error Firebase: " + e.message);
                }
            };

            // Handling Simpan Hafalan
            const saveHafalan = async () => {
                if (!selClass) return alert('Mohon pilih Kelas!');
                if (Object.keys(hafalanData).length === 0) return alert('Belum ada nilai hafalan yang diinput.');

                try {
                    for (const studentId of Object.keys(hafalanData)) {
                        await window.fb.methods.addDoc(window.fb.methods.collection(window.fb.db, 'artifacts', appId, 'users', user.uid, 'scores'), {
                            studentId, 
                            classId: selClass, 
                            type: 'hafalan', 
                            hafalanScores: hafalanData[studentId] || Array(9).fill(""),
                            timestamp: new Date().toISOString()
                        });
                    }
                    alert('Data Hafalan berhasil disimpan!');
                    setHafalanData({});
                } catch (e) {
                    console.error("Gagal simpan hafalan:", e);
                    alert("Error Firebase: " + e.message);
                }
            };

            // Handling Simpan PH
            const savePH = async () => {
                if (!selClass || !meetingName) return alert('Mohon pilih Kelas dan isi Nama Pertemuan!');
                if (Object.keys(phData).length === 0) return alert('Belum ada nilai yang diinput.');

                try {
                    for (const studentId of Object.keys(phData)) {
                        await window.fb.methods.addDoc(window.fb.methods.collection(window.fb.db, 'artifacts', appId, 'users', user.uid, 'scores'), {
                            studentId, 
                            classId: selClass, 
                            type: 'ph', 
                            meeting: meetingName.trim(),
                            score: phData[studentId],
                            timestamp: new Date().toISOString()
                        });
                    }
                    alert('Data Penilaian Harian berhasil disimpan!');
                    setPhData({});
                    setBulkVal('');
                } catch (e) {
                    console.error("Gagal simpan PH:", e);
                    alert("Error Firebase: " + e.message);
                }
            };

            return (
                <div className="space-y-6 md:space-y-10 animate-in slide-in-from-bottom-4">
                    <h1 className="text-2xl sm:text-3xl md:text-4xl font-black text-gray-900 tracking-tight">Input Penilaian Siswa</h1>
                    
                    {/* Header Input Dropdown */}
                    <div className="glass-card p-6 md:p-8 rounded-[2rem] border-none shadow-sm grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="space-y-2">
                            <label className="text-xs font-black text-gray-400 uppercase tracking-widest">1. Pilih Kelas</label>
                            <select value={selClass} onChange={e => setSelClass(e.target.value)} className="w-full bg-gray-50 border-none p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold text-sm">
                                <option value="">-- Pilih Kelas --</option>
                                {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                        </div>
                        <div className="space-y-2">
                            <label className="text-xs font-black text-gray-400 uppercase tracking-widest">2. Jenis Penilaian</label>
                            <select value={jenisNilai} onChange={e => setJenisNilai(e.target.value)} className="w-full bg-gray-50 border-none p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold text-sm">
                                <option value="Kehadiran">Kehadiran</option>
                                <option value="Hafalan">Hafalan</option>
                                <option value="Penilaian Harian">Penilaian Harian</option>
                            </select>
                        </div>
                    </div>

                    {/* Tampilan Sesuai Jenis Nilai yang Dipilih */}
                    {selClass ? (
                        <div className="space-y-6">
                            {/* Option A: KEHADIRAN */}
                            {jenisNilai === 'Kehadiran' && (
                                <div className="glass-card rounded-[2rem] md:rounded-[3rem] overflow-hidden border-none shadow-lg space-y-6">
                                    <div className="bg-gradient-to-r from-blue-900 to-indigo-900 p-6 md:p-8 text-white space-y-4">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                            <div>
                                                <h3 className="text-xl font-bold">Input Presensi & Kehadiran</h3>
                                                <p className="text-xs text-blue-200">Bobot Kehadiran 50% dari total nilai pertemuan.</p>
                                            </div>
                                            <div className="w-full md:w-auto">
                                                <input 
                                                    value={meetingName} 
                                                    onChange={e => setMeetingName(e.target.value)} 
                                                    placeholder="Nama Pertemuan (Contoh: Pertemuan 1)" 
                                                    className="w-full md:w-72 bg-white/10 border border-white/20 p-3.5 rounded-2xl text-white placeholder-blue-200 text-sm font-bold outline-none focus:border-white" 
                                                />
                                            </div>
                                        </div>

                                        {/* Set Semua Kehadiran */}
                                        <div className="pt-2 border-t border-white/10 flex items-center gap-2 overflow-x-auto custom-scroll pb-2">
                                            <span className="text-[10px] uppercase font-black tracking-widest text-blue-200 whitespace-nowrap">Set Semua:</span>
                                            {ATTENDANCE_OPTIONS.map(opt => (
                                                <button 
                                                    key={opt.label} 
                                                    onClick={() => handleBulkAttendance(opt.score)}
                                                    className="text-xs font-bold bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-xl border border-white/20 whitespace-nowrap transition-all"
                                                >
                                                    {opt.symbol} {opt.score}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="p-6 md:p-8 space-y-4">
                                        <div className="divide-y divide-gray-100">
                                            {filteredStudents.map(s => (
                                                <div key={s.id} className="py-4 flex flex-col lg:flex-row lg:items-center justify-between gap-4 hover:bg-gray-50/50 p-3 rounded-2xl">
                                                    <span className="font-bold text-gray-800 text-sm lg:w-1/4">{s.name}</span>
                                                    
                                                    {/* Pilihan Opsi Kehadiran */}
                                                    <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2 flex-1">
                                                        {ATTENDANCE_OPTIONS.map(opt => {
                                                            const isSelected = attendanceData[s.id] === opt.score;
                                                            return (
                                                                <button
                                                                    key={opt.label}
                                                                    type="button"
                                                                    onClick={() => setAttendanceData({ ...attendanceData, [s.id]: opt.score })}
                                                                    className={`p-2 rounded-xl text-xs font-bold border transition-all flex flex-col items-center justify-center gap-1 ${
                                                                        isSelected ? `${opt.badgeBg} ring-2 ring-blue-500 scale-105 shadow-md` : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
                                                                    }`}
                                                                >
                                                                    <span className="text-base">{opt.symbol}</span>
                                                                    <span className="text-[9px] text-center leading-tight truncate w-full">{opt.label}</span>
                                                                    <span className="text-[10px] font-black opacity-80">({opt.score})</span>
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <button onClick={saveKehadiran} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-base shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all flex items-center justify-center gap-2 mt-6">
                                            <i data-lucide="save"></i> SIMPAN KEHADIRAN (50%)
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Option B: HAFALAN */}
                            {jenisNilai === 'Hafalan' && (
                                <div className="glass-card rounded-[2rem] md:rounded-[3rem] overflow-hidden border-none shadow-lg space-y-6">
                                    <div className="bg-gradient-to-r from-emerald-900 to-teal-900 p-6 md:p-8 text-white">
                                        <h3 className="text-xl font-bold">Input Nilai Hafalan (9 Kolom Nilai)</h3>
                                        <p className="text-xs text-emerald-200">Penilaian hafalan berdiri sendiri dari nilai harian.</p>
                                    </div>

                                    <div className="p-4 md:p-8 overflow-x-auto custom-scroll">
                                        <table className="w-full text-left min-w-[800px]">
                                            <thead>
                                                <tr className="border-b border-gray-100 text-[11px] font-black text-gray-400 uppercase tracking-wider">
                                                    <th className="p-3 w-48">Nama Siswa</th>
                                                    {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                                                        <th key={num} className="p-2 text-center">Hafalan {num}</th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {filteredStudents.map(s => {
                                                    const currentHafalan = hafalanData[s.id] || Array(9).fill("");
                                                    return (
                                                        <tr key={s.id} className="hover:bg-gray-50/50">
                                                            <td className="p-3 font-bold text-gray-800 text-sm whitespace-nowrap">{s.name}</td>
                                                            {[0, 1, 2, 3, 4, 5, 6, 7, 8].map(colIdx => (
                                                                <td key={colIdx} className="p-1.5 text-center">
                                                                    <input 
                                                                        type="number"
                                                                        value={currentHafalan[colIdx] || ''}
                                                                        onChange={e => {
                                                                            const updatedArr = [...currentHafalan];
                                                                            updatedArr[colIdx] = e.target.value;
                                                                            setHafalanData({ ...hafalanData, [s.id]: updatedArr });
                                                                        }}
                                                                        className="w-14 p-2 text-center bg-gray-50 border border-gray-200 rounded-xl font-bold text-sm outline-none focus:border-emerald-500"
                                                                        placeholder="0"
                                                                    />
                                                                </td>
                                                            ))}
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>

                                        <button onClick={saveHafalan} className="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-base shadow-xl shadow-emerald-100 hover:bg-emerald-700 transition-all flex items-center justify-center gap-2 mt-8">
                                            <i data-lucide="save"></i> SIMPAN SEMUA NILAI HAFALAN
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Option C: PENILAIAN HARIAN */}
                            {jenisNilai === 'Penilaian Harian' && (
                                <div className="glass-card rounded-[2rem] md:rounded-[3rem] overflow-hidden border-none shadow-lg space-y-6">
                                    <div className="bg-gray-900 p-6 md:p-8 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <h3 className="text-xl font-bold">Input Penilaian Harian (PH)</h3>
                                            <p className="text-xs text-gray-400">Bobot Penilaian Harian 50% dari total nilai pertemuan.</p>
                                        </div>
                                        <div className="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                                            <input 
                                                value={meetingName} 
                                                onChange={e => setMeetingName(e.target.value)} 
                                                placeholder="Nama Pertemuan (Contoh: PH 1)" 
                                                className="w-full sm:w-60 bg-white/10 border border-white/20 p-3 rounded-xl text-white placeholder-gray-400 text-sm font-bold outline-none focus:border-blue-400" 
                                            />
                                            <div className="flex items-center gap-2 bg-white/10 p-1.5 rounded-xl border border-white/20 w-full sm:w-auto">
                                                <span className="text-[10px] text-gray-400 font-bold uppercase pl-2">Set:</span>
                                                <input 
                                                    value={bulkVal} 
                                                    onChange={e => handleBulkPH(e.target.value)} 
                                                    type="number" 
                                                    className="w-16 bg-transparent text-white font-bold text-center outline-none" 
                                                    placeholder="0" 
                                                />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="p-6 md:p-8 space-y-4">
                                        <div className="divide-y divide-gray-100">
                                            {filteredStudents.map(s => (
                                                <div key={s.id} className="py-3 flex items-center justify-between hover:bg-gray-50/50 p-2 rounded-2xl">
                                                    <span className="font-bold text-gray-800 text-sm">{s.name}</span>
                                                    <input 
                                                        type="number" 
                                                        value={phData[s.id] !== undefined ? phData[s.id] : ''} 
                                                        onChange={e => setPhData({ ...phData, [s.id]: parseFloat(e.target.value) || 0 })}
                                                        className="w-28 p-3 rounded-xl border-2 border-gray-100 text-center font-black text-lg focus:border-blue-500 outline-none" 
                                                        placeholder="0" 
                                                    />
                                                </div>
                                            ))}
                                        </div>

                                        <button onClick={savePH} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-base shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all flex items-center justify-center gap-2 mt-6">
                                            <i data-lucide="save"></i> SIMPAN PENILAIAN HARIAN (50%)
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className="glass-card p-12 text-center rounded-[2.5rem] border-none text-gray-400 font-medium">
                            <i data-lucide="arrow-up" className="w-8 h-8 mx-auto mb-2 animate-bounce text-blue-500"></i>
                            Silakan pilih Kelas terlebih dahulu untuk menginput nilai.
                        </div>
                    )}
                </div>
            );
        };

        // Component 4: Rekap & Ekspor Nilai
        const RekapNilai = ({ classes, students, scores }) => {
            const [selClass, setSelClass] = useState('');

            const calculatedData = useMemo(() => {
                return calculateStudentStats(students, scores, classes);
            }, [students, scores, classes]);

            const tableRows = useMemo(() => {
                return calculatedData.filter(s => !selClass || s.classId === selClass);
            }, [calculatedData, selClass]);

            const exportToExcel = () => {
                const exportData = tableRows.map(s => ({
                    "Nama Siswa": s.name,
                    "Kelas": s.className,
                    "Rata-rata Pertemuan (50% Kehadiran + 50% PH)": s.meetingAvg,
                    "Rata-rata Hafalan": s.hafalanAvg,
                    "Nilai Akhir Keseluruhan": s.overallAvg
                }));

                if (exportData.length === 0) return alert('Tidak ada data nilai yang bisa diekspor.');

                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Rekap_Nilai");
                XLSX.writeFile(wb, `Rekap_Nilai_${classes.find(c => c.id === selClass)?.name || 'Semua_Kelas'}.xlsx`);
            };

            return (
                <div className="space-y-6 md:space-y-10 animate-in slide-in-from-bottom-4">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 className="text-2xl sm:text-3xl md:text-4xl font-black text-gray-900 tracking-tight">Rekap Data Nilai</h1>
                            <p className="text-gray-400 mt-1 text-sm md:text-base font-medium">Rekapitulasi gabungan pertemuan dan hafalan tersusun alfabetis.</p>
                        </div>
                        <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">
                            <select value={selClass} onChange={e => setSelClass(e.target.value)} className="bg-white border border-gray-200 p-3.5 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm text-sm">
                                <option value="">Semua Kelas</option>
                                {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                            <button onClick={exportToExcel} className="bg-emerald-600 text-white px-6 py-3.5 rounded-2xl font-bold shadow-lg shadow-emerald-100 hover:bg-emerald-700 transition-all flex items-center justify-center gap-2 text-sm">
                                <i data-lucide="download" className="w-4 h-4"></i> Ekspor Excel
                            </button>
                        </div>
                    </div>

                    <div className="glass-card rounded-[2rem] md:rounded-[3rem] overflow-hidden border-none shadow-sm">
                        <div className="overflow-x-auto custom-scroll">
                            <table className="w-full text-left border-collapse">
                                <thead className="bg-gray-900 text-white">
                                    <tr>
                                        <th className="p-4 md:p-6 font-black text-xs uppercase tracking-widest sticky left-0 bg-gray-900 z-10">Nama Siswa</th>
                                        <th className="p-4 md:p-6 font-black text-xs uppercase tracking-widest">Kelas</th>
                                        <th className="p-4 md:p-6 font-black text-xs uppercase tracking-widest text-center">Nilai Pertemuan (50% Kehadiran + 50% PH)</th>
                                        <th className="p-4 md:p-6 font-black text-xs uppercase tracking-widest text-center">Rata-rata Hafalan</th>
                                        <th className="p-4 md:p-6 font-black text-xs uppercase tracking-widest text-center bg-blue-950">Nilai Akhir Keseluruhan</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100 bg-white">
                                    {tableRows.map(row => (
                                        <tr key={row.id} className="hover:bg-gray-50 transition-colors">
                                            <td className="p-4 md:p-6 font-bold text-gray-800 sticky left-0 bg-white shadow-sm whitespace-nowrap text-sm md:text-base">{row.name}</td>
                                            <td className="p-4 md:p-6 text-sm font-semibold text-gray-500">{row.className}</td>
                                            <td className="p-4 md:p-6 text-center font-bold text-gray-700">
                                                <span className="px-3 py-1.5 rounded-xl bg-blue-50 text-blue-700 font-black">{row.meetingAvg}</span>
                                            </td>
                                            <td className="p-4 md:p-6 text-center font-bold text-gray-700">
                                                <span className="px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 font-black">{row.hafalanAvg}</span>
                                            </td>
                                            <td className="p-4 md:p-6 text-center font-black text-base bg-blue-50/30 text-blue-900">
                                                {row.overallAvg}
                                            </td>
                                        </tr>
                                    ))}
                                    {tableRows.length === 0 && (
                                        <tr>
                                            <td colSpan="5" className="p-10 text-center text-gray-400">Tidak ada siswa ditemukan.</td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
